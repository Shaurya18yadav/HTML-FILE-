<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B!</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --accent: #f59e0b;
        --accent-2: #fcd34d;
        --text: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .badge {
        display: inline-block;
        padding: 1.2rem 2.2rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(252, 211, 77, 0.7);
        box-shadow: 0 0 30px rgba(245, 158, 11, 0.35);
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 12vw, 10rem);
        line-height: 1;
        font-weight: 900;
        color: var(--accent-2);
        text-shadow: 0 0 20px rgba(252, 211, 77, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="badge">
      <h1>B!</h1>
    </div>
  </body>
</html>
